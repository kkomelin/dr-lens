<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #14161d;
    --panel: #1d2029;
    --text: #eef0f6;
    --muted: #8a8f9c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 240px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 16px;
  }
  .domain {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .score-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
  }
  .score {
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
  }
  .label { color: var(--muted); font-size: 12px; }
  .bar {
    margin-top: 12px;
    height: 6px;
    border-radius: 3px;
    background: #2a2e3a;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 3px; width: 0; transition: width .4s ease; }
  .tier { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2c3040;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3a3f52; }
  .credit { font-size: 10px; color: #5a5f6e; }
  .credit a { color: #7b8194; text-decoration: none; }
  .state { margin-top: 10px; color: var(--muted); }
</style>
</head>
<body>
  <div class="domain" id="domain">—</div>
  <div class="score-row">
    <div class="score" id="score">·</div>
    <div class="label">Domain Rating</div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div class="tier" id="tier"></div>
  <div class="row">
    <button id="refresh">Refresh</button>
    <span class="credit">data: <a href="https://ahrefs.com" target="_blank" rel="noopener noreferrer">Ahrefs</a></span>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
