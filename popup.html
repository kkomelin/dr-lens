<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #14161d;
    --panel: #1d2029;
    --text: #eef0f6;
    --muted: #8a8f9c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    position: relative;
    width: 240px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 16px;
  }
  .domain {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 48px; /* keep clear of the gear + info icons */
  }
  .score-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
  }
  .score {
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
  }
  .label { color: var(--muted); font-size: 12px; }
  .bar {
    margin-top: 12px;
    height: 6px;
    border-radius: 3px;
    background: #2a2e3a;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 3px; width: 0; transition: width .4s ease; }
  .tier { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2c3040;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3a3f52; }
  .credit { font-size: 10px; color: #5a5f6e; }
  .credit a { color: #7b8194; text-decoration: none; }
  .state { margin-top: 10px; color: var(--muted); }
  .setup {
    display: block;
    width: 100%;
    margin-top: 10px;
    border-color: #7a5a24;
    color: #e8b96a;
  }
  /* the display:block above would otherwise defeat the hidden attribute */
  .setup[hidden] { display: none; }
  .setup:hover { border-color: #a17730; }
  .gear {
    position: absolute;
    top: 14px;
    right: 40px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid #3a3f52;
    background: #2a2e3a;
    color: var(--text);
    font-size: 11px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gear:hover { background: #3a3f52; border-color: #4a4f63; }
  .info {
    position: absolute;
    top: 14px;
    right: 16px;
  }
  .info-btn {
    list-style: none;
    cursor: pointer;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid #3a3f52;
    background: #2a2e3a;
    color: var(--text);
    font: italic 700 11px/1 Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .info-btn::-webkit-details-marker { display: none; }
  .info-btn:hover,
  .info[open] .info-btn { background: #3a3f52; border-color: #4a4f63; }
  .info[open] .info-btn { position: relative; z-index: 11; } /* stay clickable above the overlay */
  .info-pop {
    position: fixed;
    inset: 0;
    background: var(--bg);
    padding: 44px 16px 16px;
    z-index: 10;
  }
  .info-pop p {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }
  .info-pop p + p { margin-top: 8px; }
  .info-pop strong { color: #c2c6d0; font-weight: normal; }
</style>
</head>
<body>
  <button class="gear" id="settings" title="Settings" aria-label="Settings">&#9881;</button>
  <details class="info">
    <summary class="info-btn" title="About Domain Rating" aria-label="About Domain Rating">i</summary>
    <div class="info-pop">
      <p><strong>Domain Rating</strong> is a 0 to 100 score based on how many sites link to this site, and how strong those sites are.</p>
      <p>To raise it, <strong>get links from more strong sites by making content worth sharing</strong>.</p>
    </div>
  </details>
  <div class="domain" id="domain">—</div>
  <div class="score-row">
    <div class="score" id="score">·</div>
    <div class="label">Domain Rating</div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div class="tier" id="tier"></div>
  <button class="setup" id="setup" hidden>Set API key</button>
  <div class="row">
    <button id="refresh">Refresh</button>
    <span class="credit">data: <a href="https://ahrefs.com" target="_blank" rel="noopener noreferrer">Ahrefs</a></span>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
